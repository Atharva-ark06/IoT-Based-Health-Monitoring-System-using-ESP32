name: Ingestion API security tests

on:
  push:
    paths:
      - "backend/**"
      - "tests/test_ingestion_api.py"
      - ".github/workflows/ingestion-api-security.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/test_ingestion_api.py"
      - ".github/workflows/ingestion-api-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingestion-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run ingestion API security tests
        run: python -m pytest -q tests/test_ingestion_api.py
