name: Dashboard security checks

on:
  push:
    paths:
      - "health/sensor_dashboard.html"
      - "tests/**"
      - ".github/workflows/dashboard-security.yml"
  pull_request:
    paths:
      - "health/sensor_dashboard.html"
      - "tests/**"
      - ".github/workflows/dashboard-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run dashboard security regression tests
        run: node --test tests/dashboard-security.test.mjs
