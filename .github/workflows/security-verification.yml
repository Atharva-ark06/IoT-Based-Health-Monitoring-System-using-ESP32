name: Security verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt bandit pip-audit

      - name: Run API regression and security tests
        run: python -m pytest -q tests/test_ingestion_api.py

      - name: Run Bandit Python security scan
        run: bandit -q -r backend -ll

      - name: Audit installed Python dependencies
        run: pip-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run dashboard regression tests
        run: node --test tests/dashboard-security.test.mjs
